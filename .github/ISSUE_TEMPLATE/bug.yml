name: Bug report
description: A Job ran when it should not have, did not run when it should, or the Page says something wrong.
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        A Job's arguments and a Run's sentence can hold things you would not
        post in public. Leave them out, or replace them, unless they are the
        bug. Never paste FirstMate's token or `runtime.json`.

        If this is a security problem, do not file it here. See
        [SECURITY.md](https://github.com/luanAfons0/scheduler/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the Scheduler did, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: job
    attributes:
      label: The Job
      description: >
        The Job from `jobs.json`, as it is in the file. Its When and its zone
        are usually the answer.
      render: json
    validations:
      required: true

  - type: textarea
    id: runs
    attributes:
      label: Its Runs
      description: >
        That Job's entry in `state.json`, or what the Plugin Page shows for it:
        each Outcome, when it started, whether it was Late, and what it said.
      render: json
    validations:
      required: false

  - type: textarea
    id: journal
    attributes:
      label: What the journal says
      description: >
        The lines from `journalctl --user -u firstmate` that start with
        `scheduler:`, around the time it went wrong.
      render: shell
    validations:
      required: false

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: >
        The output of `node -v; uname -sr`, the FirstMate version, and whether
        you are on WSL. Say if the machine slept or was off around the Due time.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: suite
    attributes:
      label: The suite
      options:
        - label: I ran `npm test` and said above whether it passed.
          required: false
